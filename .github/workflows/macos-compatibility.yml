name: macOS compatibility check

on:
  push:
    branches:
      - main
      - 'codex/mac-*'
      - 'codex/macos-*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-package:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check Swift toolchain
        run: swift --version
      - name: Build shared Swift packages for macOS
        run: swift build
      - name: Test shared Swift packages on macOS
        run: swift test
      - name: Generate native Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build native macOS app
        run: xcodebuild -project ReadingCompanion.xcodeproj -scheme ReadingCompanionMac -destination 'generic/platform=macOS' CODE_SIGNING_ALLOWED=NO build
