name: ReadingCompanion
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  Foundations:
    path: .
configs:
  Debug: debug
  Release: release
targets:
  ReadingCompanion:
    type: application
    platform: iOS
    sources:
      - App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.readingcompanion.app
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: Foundations
        product: ReadingUI
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Reading Companion
        UIAppFonts:
          - Manrope-Regular.ttf
          - Manrope-Medium.ttf
          - Manrope-SemiBold.ttf
          - Papernotes-Regular.ttf
          - HelloBaby.ttf
  FoundationAcceptanceTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.readingcompanion.foundationtests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: ReadingCompanion
schemes:
  ReadingCompanion:
    build:
      targets:
        ReadingCompanion: all
    test:
      targets:
        - FoundationAcceptanceTests
